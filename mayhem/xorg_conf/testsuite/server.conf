Section "ServerFlags"
    Option "AllowMouseOpenFail" "true"
    Option "BlankTime" "10"
EndSection

Section "Files"
    FontPath "/usr/share/fonts/X11/misc"
    ModulePath "/usr/lib/xorg/modules"
EndSection

Section "Module"
    Load "glx"
    Disable "dri"
    SubSection "extmod"
        Option "omit xfree86-dga"
    EndSubSection
EndSection

Section "Extensions"
    Option "Composite" "Enable"
EndSection
