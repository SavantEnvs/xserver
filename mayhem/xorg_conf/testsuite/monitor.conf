Section "Monitor"
    Identifier   "Monitor0"
    VendorName   "ACME"
    ModelName    "M1"
    HorizSync    30.0 - 83.0
    VertRefresh  56.0 - 76.0
    Gamma        1.0 1.0 1.0
    Modeline "1024x768" 65.0 1024 1048 1184 1344 768 771 777 806 -hsync -vsync
    Option "DPMS"
EndSection

Section "Device"
    Identifier "Card0"
    Driver "intel"
    BusID "PCI:0:2:0"
    VideoRam 65536
    Option "AccelMethod" "sna"
EndSection

Section "Screen"
    Identifier "Screen0"
    Device "Card0"
    Monitor "Monitor0"
    DefaultDepth 24
    SubSection "Display"
        Viewport 0 0
        Depth 24
        Modes "1024x768" "800x600"
    EndSubSection
EndSection
